[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --strict-markers
markers =
    layer1_unit: Layer 1 — liquidity engine unit tests (testing-scripts-prompt.md §1)
    layer2_anomaly: Layer 2 — anomaly detection validation (§2)
    layer3_api: Layer 3 — API / integration tests (§3)
    layer4_data_quality: Layer 4 — data-quality / fallback tests (§4)
    layer5_coordination: Layer 5 — coordination / workflow tests (§5)
    layer6_explainability: Layer 6 — explainability coverage (§6)
    layer7_perf: Layer 7 — performance / latency (§7)
    layer8_locale: Layer 8 — Bengali / Banglish output (§8)
    layer9_security: Layer 9 — security / privacy smoke (§9)
    judge_p1: Killer-judge PART 1 — guardrail violation hunting
    judge_p2: Killer-judge PART 2 — rubric-weighted adversarial suite
    judge: Any judge-suite test (PART 1 or PART 2)
    guardrail_critical: Section 14 disqualification risk — guardrail violations
    rubric_technical: PART 2 §1 — Technical (25%)
    rubric_data: PART 2 §2 — Data & analytical quality (20%)
    rubric_problem_understanding: PART 2 §3 — Problem understanding (15%)
    rubric_ux: PART 2 §4 — UX & explainability (10%)
    rubric_security: PART 2 §5 — Security/privacy/fairness (5%)
    rubric_presentation: PART 2 §6 — Presentation (5%)
    slow: Marks tests as slow (perf / load tests).
filterwarnings =
    ignore::DeprecationWarning